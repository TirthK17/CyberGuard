<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/intro/kavach-final.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Intro Poster Preload for Instant First-Frame Paint -->
    <link rel="preload" as="image" href="/intro/kavach-poster.jpg" />

    <!-- SEO & Metadata -->
    <title>Kavach — Cyber Awareness. Human Defence.</title>
    <meta name="description" content="Kavach: Advanced cybersecurity awareness and human defense platform. Interactive simulations, threat intelligence, and human defense telemetry." />
    <meta name="theme-color" content="#dfe5e6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph & Social Preview -->
    <meta property="og:title" content="Kavach — Cyber Awareness. Human Defence." />
    <meta property="og:description" content="Interactive cybersecurity awareness platform for phishing defense, realistic attacks, and human defense telemetry." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kavach — Cyber Awareness. Human Defence." />
    <meta name="twitter:description" content="Cyber awareness. Human defence. Interactive training & telemetry." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Inline Pre-React Intro Check to Prevent Flash -->
    <script>
      (function() {
        try {
          var params = new URLSearchParams(window.location.search);
          var forceIntro = params.get('intro') === '1';
          var skipIntro = params.get('intro') === '0';
          var prefersReducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          var seen = sessionStorage.getItem('kavach_intro_seen_v1');
          if (!skipIntro && (forceIntro || (!prefersReducedMotion && seen !== '1'))) {
            document.documentElement.dataset.intro = 'on';
          }
        } catch (e) {}
      })();
    </script>
    <style>
      :root {
        --intro-bg: #dfe5e6;
      }
      html[data-intro="on"], html[data-intro="on"] body {
        background-color: var(--intro-bg) !important;
      }
      html[data-intro="on"] #root:empty {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        background: #dfe5e6 radial-gradient(ellipse at 50% 45%, #eef3f6 0%, #dfe5e6 70%);
      }
      html[data-intro="on"] #root:empty::before {
        content: '';
        display: block;
        width: min(78vw, 980px);
        aspect-ratio: 16 / 9;
        background-image: url('/intro/kavach-poster.jpg');
        background-size: contain;
        background-position: center;
        background-repeat: no-repeat;
        -webkit-mask-image: radial-gradient(ellipse 46% 44% at 50% 50%, #000 0%, #000 36%, rgba(0, 0, 0, 0.85) 50%, rgba(0, 0, 0, 0.3) 72%, transparent 92%);
        mask-image: radial-gradient(ellipse 46% 44% at 50% 50%, #000 0%, #000 36%, rgba(0, 0, 0, 0.85) 50%, rgba(0, 0, 0, 0.3) 72%, transparent 92%);
      }
    </style>

    <!-- Google Fonts — Plus Jakarta Sans, Inter, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600&family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Gujarati:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Tabler Icons -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/@tabler/icons-webfont@3.29.0/dist/tabler-icons.min.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
